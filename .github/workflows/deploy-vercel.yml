# Manual deploy of the Bazel-built React SPA + Django (Vercel Python runtime).
# Does not run on push or pull request — open Actions → Deploy to Vercel → Run workflow.
name: Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      production:
        description: Deploy to production (unchecked creates a preview URL)
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    environment:
      name: Vercel-prod
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: |
          if [ "${{ inputs.production }}" = "true" ]; then
            vercel pull --yes --environment=production
          else
            vercel pull --yes --environment=preview
          fi

      - name: Bake Clerk key into the frontend
        run: |
          env_file=""
          for f in .vercel/.env.production.local .vercel/.env.preview.local .env.local; do
            if [ -f "$f" ]; then
              env_file="$f"
              break
            fi
          done
          if [ -z "$env_file" ]; then
            echo "::warning::No Vercel env file after pull; frontend will build without Clerk."
            exit 0
          fi
          set -a
          # shellcheck disable=SC1090
          . "$env_file"
          set +a
          if [ -z "${VITE_CLERK_PUBLISHABLE_KEY:-}" ]; then
            echo "::warning::VITE_CLERK_PUBLISHABLE_KEY is not set on the Vercel project. Sign-in will stay disabled until it is added and this workflow is re-run."
            exit 0
          fi
          printf 'VITE_CLERK_PUBLISHABLE_KEY=%s\n' "$VITE_CLERK_PUBLISHABLE_KEY" > frontend/.env.production
          echo "Wrote frontend/.env.production for Vite (key value not logged)."

      - name: Build frontend
        run: bazel build //frontend:bundle

      - name: Stage SPA into public/
        run: |
          rm -rf public
          mkdir -p public
          bin="$(bazel info bazel-bin)"
          # Follow Bazel symlinks so the upload contains real files, not the sandbox farm.
          cp -aL "${bin}/frontend/dist/." public/
          chmod -R u+w public
          test -f public/index.html

      - name: Migrate Neon (production only)
        if: ${{ inputs.production }}
        run: |
          env_file=""
          for f in .vercel/.env.production.local .env.local; do
            if [ -f "$f" ]; then
              env_file="$f"
              break
            fi
          done
          if [ -z "$env_file" ]; then
            echo "No Vercel env file after pull; cannot migrate." >&2
            exit 1
          fi
          set -a
          # shellcheck disable=SC1090
          . "$env_file"
          set +a
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL is not set on the Vercel project." >&2
            exit 1
          fi
          bazel run //backend:manage -- migrate --noinput

      - name: Deploy to Vercel
        id: deploy
        run: |
          extra=()
          if [ "${{ inputs.production }}" = "true" ]; then
            extra+=(--prod)
          fi
          url="$(vercel deploy --yes "${extra[@]}")"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Deployed"
            echo
            echo "- URL: ${url}"
          } >> "${GITHUB_STEP_SUMMARY}"
