# Manual production/preview deploy of the Bazel-built React SPA to Vercel.
# Does not run on push or pull request — open Actions → Deploy to Vercel → Run workflow.
name: Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      production:
        description: Deploy to production (unchecked creates a preview URL)
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: Vercel-prod
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build frontend
        run: bazel build //frontend:bundle

      - name: Stage static output
        run: |
          mkdir -p dist
          bin="$(bazel info bazel-bin)"
          # Follow Bazel symlinks so the upload contains real files, not the sandbox farm.
          cp -aL "${bin}/frontend/dist/." dist/
          test -f dist/index.html

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        id: deploy
        run: |
          extra=()
          if [ "${{ inputs.production }}" = "true" ]; then
            extra+=(--prod)
          fi
          url="$(vercel deploy dist --yes "${extra[@]}")"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Deployed"
            echo
            echo "- URL: ${url}"
          } >> "${GITHUB_STEP_SUMMARY}"
