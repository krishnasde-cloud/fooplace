<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />
    <meta name="robots" content="{{ robots }}" />
    <link rel="canonical" href="{{ canonical }}" />
    <script type="application/ld+json">{{ json_ld }}</script>
    {% if spa.css %}<link rel="stylesheet" href="{{ spa.css }}" />{% endif %}
  </head>
  <body>
    <div id="root">
      {% block content %}{% endblock %}
    </div>
    <script type="application/json" id="fooplace-ssr-data">{{ ssr_data }}</script>
    {% if spa.js %}<script type="module" src="{{ spa.js }}"></script>{% endif %}
  </body>
</html>
